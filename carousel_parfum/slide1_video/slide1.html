<!doctype html><html><head><meta charset="utf-8">
<style>
@font-face{font-family:Caveat;src:url(Caveat.ttf)}
@font-face{font-family:Mont;src:url(Montserrat.ttf)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px;overflow:hidden}
body{background:#f2f2f1;font-family:Mont;color:#1e2846;position:relative}
.t{position:absolute;left:80px;opacity:0;z-index:2}.price{z-index:2}
.hand{font-family:Caveat;font-weight:600}
.l1{top:55px;font-size:92px}
.l2{top:160px;font-size:54px;font-weight:400;letter-spacing:1px}
.l3{top:215px;font-size:138px;font-weight:900;letter-spacing:4px;color:#22305e}
.l4{top:420px;font-size:76px;line-height:1.0;color:#3d5a9e}
.price{position:absolute;right:70px;top:600px;opacity:0;background:#a9c1e8;color:#1e2846;border-radius:60px;padding:22px 40px;font-size:46px;font-weight:700;transform:rotate(-4deg)}
.price small{display:block;font-family:Caveat;font-size:40px;font-weight:500;text-align:center}
.l5{top:1110px;font-size:46px;font-weight:400;font-style:italic}
.l6{top:1185px;left:auto;right:80px;font-size:96px;font-weight:700;color:#22305e}
.l6 u{text-decoration:none;border-bottom:5px solid #a9c1e8}
#shoe{position:absolute;left:0;top:-150px;width:1080px;height:1350px;opacity:0}#shoe img{width:100%;height:100%;display:block;-webkit-mask-image:linear-gradient(180deg,#000 85%,transparent 100%)}
/* animations */
@keyframes fromL{from{opacity:0;transform:translateX(-160px)}to{opacity:1;transform:none}}
@keyframes fromR{from{opacity:0;transform:translateX(220px)}to{opacity:1;transform:none}}
@keyframes fromB{from{opacity:0;transform:translateY(90px)}to{opacity:1;transform:none}}
@keyframes pop{0%{opacity:0;transform:scale(1.12)}100%{opacity:1;transform:scale(1)}}
@keyframes tag{0%{opacity:0;transform:translateX(200px) rotate(10deg)}100%{opacity:1;transform:rotate(-4deg)}}
.a{animation-duration:.7s;animation-fill-mode:both;animation-timing-function:cubic-bezier(.2,.8,.2,1)}
.l1{animation-name:fromL;animation-delay:.3s}
.l2{animation-name:fromL;animation-delay:.9s}
.l3{animation-name:fromR;animation-delay:1.4s}
.l4{animation-name:fromL;animation-delay:2.1s}
#shoe{animation-name:pop;animation-delay:2.6s;animation-duration:1.4s}
.price{animation-name:tag;animation-delay:3.6s}
.l5{animation-name:fromB;animation-delay:4.6s}
.l6{animation-name:fromR;animation-delay:5.8s}
</style></head><body>
<div class="t a hand l1">Коли твоя донька</div>
<div class="t a l2">хоче аромат</div>
<div class="t a l3">GOOD GIRL</div>
<div class="t a hand l4">ту саму<br>«туфельку»…</div>

<div id="shoe" class="a"><img src="shoe.jpg"></div>

<div class="price a">від 70$<small>за 30 мл</small></div>
<div class="t a l5">Але ти не можеш собі це дозволити…</div>
<div class="t a hand l6"><u>Але є вихід</u> →</div>
</body></html>
